name: Compilar APK de Kibo IPTV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar plataforma y herramientas de Android
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Copiar la interfaz web dentro de la app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp web/* android/app/src/main/assets/www/
          sed -i '/WEBAPIS/d' android/app/src/main/assets/www/index.html

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar el APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: Kibo-IPTV-apk
          path: android/app/build/outputs/apk/release/*.apk
