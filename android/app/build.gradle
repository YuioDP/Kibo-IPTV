plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kibo.iptv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kibo.iptv'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        // 64 bits (arm64) para teléfonos modernos; x86_64 solo para emuladores
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    signingConfigs {
        release {
            storeFile file('kibo.jks')
            storePassword 'kibo-iptv-2026'
            keyAlias 'kibo'
            keyPassword 'kibo-iptv-2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    def media3 = '1.3.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    // Decodificador FFmpeg de Jellyfin (AC3/EAC3/DTS/TrueHD...). Licencia GPLv3.
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:$media3+1"
}
